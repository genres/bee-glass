# bee glass — Hyprland (0.56 syntax). Source this from hyprland.conf.
# Blur behind translucent windows:
decoration {
    blur {
        enabled = true
        size = 8
        passes = 3
    }
}
# Firefox draws its own alpha (toolbar + pages). Keep the window itself at full opacity so
# photos and videos stay solid, and let the compositor blur behind the see-through parts.
windowrule = opacity 1.0 override 1.0 override 1.0 override, opaque off, no_blur off, match:class ^([Ff]irefox|org\.mozilla\.firefox)$
